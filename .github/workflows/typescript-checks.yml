name: CSL TypeScript Checks

on:
  push:
    branches:
      - refactor/typed-solid-architecture
      - refactor/module-dto-schema-types
      - feature/updated-csl-project-plan
      - feature/season-based-mock-data
      - feature/season-management-complete
      - feature/season-management-final-hardening
      - feature/match-status-transition-rules
      - feature/match-completion-validation
      - feature/match-status-audit-history
      - feature/match-postponement-rescheduling
      - feature/match-status-management-ui
      - feature/match-goal-status-restrictions
      - feature/completed-match-correction
      - feature/match-status-mock-sync-tests
      - fix/auction-lifecycle-and-fixture-validation
      - fix/auction-lot-management-actions
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/typescript-checks.yml"

jobs:
  backend:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Typecheck backend
        if: always()
        run: npm run typecheck
      - name: Build backend
        if: always()
        run: npm run build

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npx eslint src/pages/admin/SeasonsPage.tsx src/pages/matches/SeasonMatchDetailsPage.tsx src/components/matches/MatchStatusManager.tsx src/components/matches/CompletedMatchCorrectionDrawer.tsx src/components/forms/SeasonMatchForm.tsx src/components/forms/TeamForm.tsx src/types/team.types.ts src/types/season.types.ts src/types/seasonMatch.types.ts src/services/seasonService.ts src/services/seasonMatchService.ts src/mocks/seasonRepository.ts src/pages/AuctionsPage.tsx src/mocks/seasonSeed.ts src/mocks/matchLifecycleRules.ts src/mocks/matchLifecycleRules.test.ts
      - name: Typecheck and build frontend
        run: npm run build
